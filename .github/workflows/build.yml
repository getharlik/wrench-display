# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # 21 for Minecraft 1.21.x and the Paper plugin, 25 (last = default) for 26.x and Gradle
          java-version: |
            21
            25
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: game tests
        # runs the in-game tests of every Fabric version (:fabric:<version>:runGameTest)
        run: ./gradlew runGameTest
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/versions/*/build/libs/
            paper/build/libs/
            resourcepack/build/distributions/
