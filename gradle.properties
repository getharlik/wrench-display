# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft version used by the Paper module (the Fabric versions are in fabric/stonecutter.properties.toml)
minecraft_version=26.3

# Mod Properties
version=1.1
group=dev.harlik

# Shared library versions (common module, compile-only; Minecraft/Paper provide them at runtime)
joml_version=1.10.8
gson_version=2.11.0
junit_version=5.13.4

# Paper plugin
paper_api_version=1.21.7-R0.1-SNAPSHOT
run_paper_version=3.1.0
