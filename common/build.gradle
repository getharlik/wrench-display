plugins {
	id 'java-library'
}

// Pure Java core shared by the Fabric mod and the Paper plugin.
// Targets Java 21 (what Minecraft 1.21 runs on) so the backports down to 1.21 can reuse it unchanged.
// JOML and Gson are provided at runtime by Minecraft (and by Paper).
dependencies {
	compileOnly "org.joml:joml:${project.joml_version}"
	compileOnly "com.google.code.gson:gson:${project.gson_version}"

	testImplementation "org.joml:joml:${project.joml_version}"
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
	archivesName = "${rootProject.name}-common"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.current()
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

// Assets are bundled by each platform (and the resource pack), not shipped inside the library jar.
jar {
	exclude 'assets/**'
}
